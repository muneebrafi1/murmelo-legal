<!doctype html>
<!-- Murmelo · index page. Source: murmelo repo store/legal/index.html, published to github.com/muneebrafi1/murmelo-legal (https://muneebrafi1.github.io/murmelo-legal/). Brand: logo D (docs/design/brand/D-ink-record). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmelo: AI Lecture Notes</title>
<meta name="description" content="Murmelo records your lectures and turns them into exam-ready notes, quizzes and flashcards. Privacy, terms and support.">
<meta property="og:title" content="Murmelo: AI Lecture Notes">
<meta property="og:description" content="Record the lecture. Get exam-ready notes, a quiz and flashcards.">
<meta property="og:image" content="https://muneebrafi1.github.io/murmelo-legal/brand/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<style>
  /* Facet tokens (docs/design/facet/facet.css). Brand: ink + paper, red only in the logo's dot. */
  :root{--canvas:#F5F5F2;--card:#FFFFFF;--hair:#E4E4DF;--hair-strong:#D4D4CE;--fill-1:#F1F1ED;--ink:#141416;--ink-2:#5F5F65;--ink-3:#737379;--on-ink:#FFFFFF}
  @media (prefers-color-scheme:dark){:root{--canvas:#000;--card:#151517;--hair:rgba(255,255,255,.08);--hair-strong:rgba(255,255,255,.18);--fill-1:#1C1C1F;--ink:#F5F5F7;--ink-2:#A3A3A9;--ink-3:#8C8C93;--on-ink:#141416}}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 48px}
  .top{display:flex;align-items:center;height:56px;margin-bottom:24px}
  .top a{display:block;line-height:0}
  .top img{display:block;height:28px;width:auto}
  h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.6px;margin:0 0 8px}
  h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.35px;margin:44px 0 12px}
  h3{font-size:17px;line-height:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px}
  .meta{color:var(--ink-2);font-size:15px;line-height:20px;margin:0 0 28px}
  .lead{font-size:19px;line-height:1.5;margin:0 0 8px}
  p{margin:0 0 14px}
  ul{padding-left:20px;margin:0 0 14px} li{margin:8px 0} li::marker{color:var(--ink-3)}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair-strong);text-decoration-thickness:1.5px;text-underline-offset:3px}
  a:hover{text-decoration-color:var(--ink)}
  strong{font-weight:650}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:24px;padding:4px 20px;margin:12px 0 16px}
  .row{padding:14px 0;border-top:1px solid var(--hair)} .row:first-child{border-top:0}
  .row p{margin:0;color:var(--ink-2);font-size:15px;line-height:21px}
  .row p + p{margin-top:4px}
  .sub{color:var(--ink-3)}
  .note{background:var(--fill-1);border-radius:14px;padding:14px 16px;font-size:15px;line-height:22px;color:var(--ink-2)}
  .note p:last-child{margin:0}
  .foot{margin-top:64px;padding-top:20px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center;color:var(--ink-3);font-size:14px}
  .foot nav{display:flex;gap:20px}
  .foot a{color:var(--ink-2);text-decoration:none;font-weight:600}
  .foot a:hover,.foot a[aria-current]{color:var(--ink)}
  .hero{padding:24px 0 8px}
  .hero img{display:block;height:44px;width:auto;margin:0 0 28px}
  .hero h1{font-size:34px;line-height:41px}
  .links{margin-top:28px}
  .links a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--hair);text-decoration:none;font-weight:600;font-size:17px}
  .links a:first-child{border-top:0}
  .links a span{color:var(--ink-3);font-weight:500;font-size:15px}
</style>
</head>
<body><div class="wrap">
<main class="hero">
  <picture><source srcset="brand/lockup-dark.svg" media="(prefers-color-scheme: dark)"><img src="brand/lockup.svg" alt="Murmelo" width="226" height="44"></picture>
  <h1>Record the lecture. Get exam-ready notes.</h1>
  <p class="lead" style="color:var(--ink-2)">Murmelo turns your lectures into notes, a quiz and flashcards, and plans your revision up to the exam. For iPhone.</p>
  <div class="card links">
    <a href="./privacy">Privacy Policy <span>→</span></a>
    <a href="./terms">Terms of Use <span>→</span></a>
    <a href="./support">Support <span>→</span></a>
  </div>
</main>
<footer class="foot"><nav aria-label="Legal"><a href="./privacy">Privacy</a><a href="./terms">Terms</a><a href="./support">Support</a></nav><span>© 2026 Muneeb Rafi</span></footer>
</div></body>
</html>
