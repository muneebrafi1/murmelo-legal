<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Shared note · Murmelo</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
<meta property="og:site_name" content="Murmelo">
<meta property="og:image" content="https://muneebrafi1.github.io/murmelo-legal/brand/og.png">
<meta property="og:title" content="A shared note from Murmelo">
<!--
  Murmelo shared-note viewer. Static page for GitHub Pages (murmelo-legal repo):
    https://muneebrafi1.github.io/murmelo-legal/n/?s=<share_slug>
  Reads the public, read-only JSON from the `note-public` edge function (no login,
  rate-limited, only notes whose owner turned sharing on). Never shows the owner,
  the audio or the transcript. Owner: backend. Source: murmelo/web/n/index.html.
-->
<style>
  :root {
    --canvas: #F5F5F2; --card: #FFFFFF; --ink: #141416; --ink2: #5F5F65; --ink3: #737379;
    --line: rgba(20,20,22,.08); --chip: #EFEFEC; --accent: #4A3BDA; --accent-tint: #EEECFF;
    --radius: 24px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #000; --card: #151517; --ink: #F5F5F7; --ink2: #A3A3A9; --ink3: #8C8C93;
            --line: rgba(255,255,255,.09); --chip: #232326; --accent: #B3A9FF; --accent-tint: #211D3F; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
         letter-spacing: -0.2px; font-variant-numeric: tabular-nums; }
  main { max-width: 680px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 28px) 16px 48px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink2); font-family: inherit; font-weight: 600; font-size: 13px; line-height: 16px; letter-spacing: -0.05px; }
  .brand a { display: block; line-height: 0; }
  .brand img { display: block; height: 22px; width: auto; }
  h1 { font-size: 30px; line-height: 35px; font-weight: 700; letter-spacing: -0.6px; margin: 18px 0 10px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; color: var(--ink2); font-size: 13px; line-height: 18px; font-weight: 500; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--ink2); font-weight: 600; }
  .chip.course { background: var(--accent-tint); color: var(--accent); }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-top: 12px; }
  .card h2 { font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -0.35px; margin: 0 0 8px; }
  .eyebrow { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; margin: 14px 0 6px; }
  p { margin: 0 0 10px; } p:last-child { margin-bottom: 0; }
  ul, ol { margin: 0; padding-left: 20px; } li { margin: 0 0 6px; } li:last-child { margin-bottom: 0; }
  .cues { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  dl { margin: 0; } dt { font-weight: 650; font-weight: 600; } dd { margin: 2px 0 10px; color: var(--ink2); }
  dd:last-child { margin-bottom: 0; }
  .formula { padding: 10px 0; border-top: 1px solid var(--line); } .formula:first-of-type { border-top: 0; padding-top: 0; }
  .expr { font: 17px/1.6 "Times New Roman", "STIX Two Math", Cambria, serif; font-style: italic; margin: 4px 0; overflow-x: auto; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; margin: 0 2px; }
  .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
  .muted { color: var(--ink2); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--ink2); border-top: 0; }
  .tablewrap { overflow-x: auto; }
  .state { text-align: center; padding: 40px 18px; }
  .state h2 { font-size: 20px; margin-bottom: 6px; }
  footer { margin-top: 28px; text-align: center; color: var(--ink3); font-size: 13px; }
  footer a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .skeleton { height: 14px; border-radius: 7px; background: var(--chip); margin: 10px 0; }
</style>
</head>
<body>
<main>
  <div class="brand"><a href="../" aria-label="Murmelo"><picture><source srcset="../brand/lockup-dark.svg" media="(prefers-color-scheme: dark)"><img src="../brand/lockup.svg" alt="Murmelo" width="113" height="22"></picture></a><span>Shared note</span></div>
  <div id="app" aria-live="polite">
    <div class="card"><div class="skeleton" style="width:60%"></div><div class="skeleton"></div><div class="skeleton" style="width:80%"></div></div>
  </div>
  <footer>Made with <a href="https://muneebrafi1.github.io/murmelo-legal/" rel="noopener">Murmelo</a> — lectures into exam-ready notes.</footer>
</main>
<script>
(function () {
  'use strict';
  var API = 'https://vwlaxabihakevghrjait.supabase.co/functions/v1/note-public';
  var COURSE = {
    violet: ['#EEECFF', '#4A3BDA', '#211D3F', '#B3A9FF'], teal: ['#E2F4EF', '#0A735D', '#0F2A24', '#6FD8BF'],
    blue: ['#E4F0FC', '#1561AE', '#10233A', '#8CC4F5'], amber: ['#FDF3D8', '#855600', '#2E2510', '#F7CF6B'],
    rose: ['#FDE8F0', '#B01F57', '#3A1524', '#FF9DC0'], green: ['#E8F5E2', '#2A6F22', '#15290F', '#93D980'],
    orange: ['#FEEEE2', '#A2470A', '#33200F', '#FFAE78'], slate: ['#ECEFF3', '#4A5769', '#1C2129', '#B5C1D2']
  };
  var app = document.getElementById('app');
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /** Escaped text with **bold** kept. */
  function rich(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

  var GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', varepsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ',
    iota: 'ι', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ', phi: 'φ',
    varphi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω', Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Pi: 'Π', Sigma: 'Σ',
    Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω', cdot: '·', times: '×', pm: '±', le: '≤', leq: '≤', ge: '≥', geq: '≥',
    approx: '≈', neq: '≠', ne: '≠', infty: '∞', to: '→', rightarrow: '→', leftarrow: '←', '%': '%', degree: '°' };
  /** The small LaTeX subset the summaries use → HTML (input is escaped first). */
  function tex(src) {
    var s = esc(src)
      .replace(/\\(?:text|mathrm|mathbf|mathit|operatorname)\{([^{}]*)\}/g, '$1')
      .replace(/\\(?:qquad|quad|,|;|!)/g, ' ')
      .replace(/\\left|\\right/g, '')
      .replace(/\\(?:ldots|cdots|dots)/g, '…');
    // Innermost groups first, so nested braces (x^{2i/d_{model}}) resolve too.
    for (var i = 0; i < 5; i++) {
      s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>')
           .replace(/\\sqrt\{([^{}]*)\}/g, '√($1)')
           .replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>');
    }
    s = s.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>').replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>')
         .replace(/\\(%|[A-Za-z]+)/g, function (m, w) { return GREEK[w] || w; })
         .replace(/[{}]/g, '');
    return s;
  }
  function list(items, ordered) {
    if (!items || !items.length) return '';
    var tag = ordered ? 'ol' : 'ul';
    return '<' + tag + '>' + items.map(function (x) { return '<li>' + rich(x) + '</li>'; }).join('') + '</' + tag + '>';
  }
  function paras(items) { return (items || []).map(function (p) { return '<p>' + rich(p) + '</p>'; }).join(''); }
  function clock(sec) {
    var m = Math.floor(sec / 60), h = Math.floor(m / 60);
    return h ? h + ' h ' + (m % 60) + ' min' : Math.max(1, m) + ' min';
  }

  function section(s) {
    var h = '<section class="card"><h2>' + esc(s.heading || 'Notes') + '</h2>';
    if (s.kind === 'key_terms' && s.terms && s.terms.length) {
      h += '<dl>' + s.terms.map(function (t) { return '<dt>' + rich(t.term) + '</dt><dd>' + rich(t.definition) + '</dd>'; }).join('') + '</dl>';
    } else if (s.kind === 'formulas' && s.formulas && s.formulas.length) {
      h += s.formulas.map(function (f) {
        return '<div class="formula"><div><strong>' + esc(f.name) + '</strong></div><div class="expr">' + tex(f.expression) + '</div>' +
          (f.meaning ? '<div class="muted">' + rich(f.meaning) + '</div>' : '') + '</div>';
      }).join('');
    } else if (s.kind === 'exam_radar') {
      var blocks = [['Stressed in class', s.stressed], ['Likely exam questions', s.likelyQuestions], ['Memorize', s.memorize], ['Understand', s.understand]];
      var any = false;
      blocks.forEach(function (b) { if (b[1] && b[1].length) { any = true; h += '<div class="eyebrow">' + b[0] + '</div>' + list(b[1]); } });
      if (!any) h += list(s.bullets);
    } else {
      if (s.cues && s.cues.length) h += '<div class="cues">' + s.cues.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div>';
      h += paras(s.paragraphs) + list(s.bullets);
      if (s.table && s.table.columns) {
        h += '<div class="tablewrap"><table><tr>' + s.table.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
          (s.table.rows || []).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + rich(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
      }
    }
    return h + '</section>';
  }

  function state(title, body) {
    document.title = title + ' · Murmelo';
    app.innerHTML = '<div class="card state"><h2>' + esc(title) + '</h2><p class="muted">' + esc(body) + '</p></div>';
  }

  function render(n) {
    document.title = (n.title || 'Shared note') + ' · Murmelo';
    var meta = [];
    if (n.course && n.course.name) {
      var c = COURSE[n.course.color] || null;
      var style = c ? ' style="background:' + (dark ? c[2] : c[0]) + ';color:' + (dark ? c[3] : c[1]) + '"' : '';
      meta.push('<span class="chip course"' + style + '>' + esc(n.course.code ? n.course.code + ' · ' + n.course.name : n.course.name) + '</span>');
    }
    if (n.createdAt) {
      var d = new Date(n.createdAt);
      if (!isNaN(d)) meta.push('<span>' + esc(d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })) + '</span>');
    }
    if (n.durationSec) meta.push('<span>' + clock(n.durationSec) + ' recording</span>');
    if (n.readMinutes) meta.push('<span>' + n.readMinutes + ' min read</span>');
    if (n.keyTermCount) meta.push('<span>' + n.keyTermCount + ' key term' + (n.keyTermCount === 1 ? '' : 's') + '</span>');
    var h = '<h1>' + esc(n.title || 'Shared note') + '</h1><div class="meta">' + meta.join('<span aria-hidden="true">·</span>') + '</div>';
    if (n.overview && n.overview.length) h += '<section class="card"><h2>Overview</h2>' + paras(n.overview) + '</section>';
    (n.sections || []).forEach(function (s) { h += section(s); });
    app.innerHTML = h;
  }

  var slug = new URLSearchParams(location.search).get('s') || '';
  if (!/^[A-Za-z0-9_-]{10,32}$/.test(slug)) {
    state('This link looks incomplete', 'Ask the person who shared it to send the link again.');
    return;
  }
  fetch(API + '?s=' + encodeURIComponent(slug), { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); })
    .then(function (res) {
      if (res.status === 200) return render(res.body);
      if (res.status === 404) return state('This note isn’t shared any more', 'The owner turned sharing off, or moved the note to the trash.');
      if (res.status === 429) return state('Too many requests', 'Please wait a minute and reload the page.');
      state('Couldn’t open this note', 'Something went wrong on our side — please try again in a moment.');
    })
    .catch(function () { state('You seem to be offline', 'Check your connection and reload the page.'); });
})();
</script>
</body>
</html>
